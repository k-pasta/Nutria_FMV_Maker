name: nutria_fmv_maker
description: "Node editor for interactive movies (branching video stories), part of Nutria FMV."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  fc_native_video_thumbnail: ^4.0.0
  path: ^1.9.0
  collection: ^1.18.0
  url_launcher: ^6.3.1
  media_kit: ^1.2.0
  media_kit_libs_video: ^1.0.6
  media_kit_video: ^2.0.1
  uuid: ^4.5.1
  file_picker: ^13.3.3
  flutter_svg: ^2.0.17
  json_annotation: ^4.9.0
  freezed_annotation: ^3.1.0
  shared_preferences: ^2.5.6
  flutter_riverpod: ^3.5.0
  riverpod_annotation: ^4.0.8
  media_metadata: ^2.2.2
  material_ui: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.10
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  build_runner: ^2.17.1
  riverpod_lint: ^3.2.0

flutter:
  # Localizations from lib/l10n/*.arb (see l10n.yaml).
  generate: true
  uses-material-design: true
  assets:
    - assets/icons/nutria_logo.svg
    - assets/icons/nutria_logo_top.svg
  fonts:
    - family: SourceSans
      fonts:
        - asset: assets/fonts/SourceSans3-Italic-VariableFont_wght.ttf
          style: italic
        - asset: assets/fonts/SourceSans3-VariableFont_wght.ttf
