include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    - lib/**/*.g.dart
    - lib/**/*.freezed.dart
    - lib/l10n/generated/**
  errors:
    # Generated-code and doc lints stay informational; real problems are warnings.
    invalid_annotation_target: ignore

plugins:
  riverpod_lint: ^3.2.0

linter:
  rules:
    - always_use_package_imports
    - avoid_print
    - directives_ordering
    - prefer_const_constructors
    - prefer_final_locals
    - unawaited_futures
